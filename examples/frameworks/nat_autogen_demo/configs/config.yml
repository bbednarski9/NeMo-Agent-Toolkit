general:
  use_uvloop: true
  front_end:
    _type: console
    cors:
      allow_origins: ["*"]
  telemetry:
    logging:
      console:
        _type: console
        level: debug
    tracing:
      otelcollector:
        _type: otelcollector
        endpoint: ${OTEL_ENDPOINT:-http://localhost:6006/v1/traces}
        project: nat_autogen_demo

llms:
  openai_llm:
    _type: openai
    model_name: ${OPENAI_MODEL_NAME:-gpt-5}
    api_key: ${OPENAI_API_KEY}
    base_url: ${OPENAI_API_BASE}

functions:
  weather_update_tool:
    _type: weather_update
    description: "Get the current weather for a specified city"

workflow:
  _type: autogen_team
  llm_name: openai_llm
  description: "To get the current weather and time in a specific city"
  tool_names: [weather_update_tool]
