#
# KvThompsonRouter Configuration
# ===============================
#
# All routing parameters are under the `kv_thompson:` key.
# The router reads this file at startup and exposes hot-reload via POST /config.
#
# REQUIRED ENVIRONMENT VARIABLE:
#   DYNAMO_WORKER_COMPONENT - Component name where backend workers register.
#     - SGLang: "worker" (workers register at workers.worker.generate)
#     - vLLM:   "worker" or "backend" (depends on Dynamo image version)
#

# Infrastructure settings
infrastructure:
  block_size: 16          # KV cache block size — must match DYNAMO_KV_BLOCK_SIZE in .env (env var overrides this)
  router_type: kv_thompson  # "kv_native" (native baseline), "kv_thompson" (Thompson+native lifecycle)
  # router_type: kv_thompson  # "kv_native" (native baseline), "kv_thompson" (Thompson+native lifecycle)
  min_workers: 1          # Minimum workers required before routing starts

# KvThompsonRouter — all parameters consolidated here
#
# Scoring formula:
#   effective_overlap = max(overlap, idle_boost)              [if enable_idle_boost]
#   load_mod = exp(-queue_penalty_weight * decode_blocks² / 2500)
#   score = effective_overlap * load_mod
#         + ts_weight * Beta(wid)                             [adaptive decay if enable_adaptive_explore]
#         + lints_weight * tanh(LinTS(wid, x))                [if enable_lints]
#         + affinity_bonus * load_mod                         [if enable_affinity]
#         - switching_penalty                                 [if enable_switching_cost]
#
# Selection:
#   enable_cold_start → round-robin when max overlap < cold_start_threshold
#   enable_softmax    → softmax(scores, temperature) → probabilistic pick
#   else              → deterministic argmax
#
kv_thompson:

  # --- Learner hyperparameters ---
  beta_decay: 0.995             # Exponential decay for Beta bandit (0.995 = window ≈ 200 obs)
  lints_lambda: 1.0             # LinTS ridge regression regularization strength
  lints_v: 0.25                 # LinTS exploration variance in posterior sampling
  lints_forget_rate: 0.995      # LinTS exponential decay (0.995 = window ≈ 200)
  latency_ema_alpha: 0.2        # EMA smoothing factor for latency reward baselines

  # --- Base scoring parameters ---
  ts_weight: 0.05               # Weight of Beta-TS exploration term (range: 0..1, higher = more exploration)
  idle_boost: 0.135             # Floor overlap for idle workers (prevents starvation; 0 = no boost)
  temperature: 1.70             # Softmax temperature for selection (lower = greedier, higher = more spread)
  temp_min: 0.15                # Minimum temperature clamp (most greedy)
  temp_max: 2.0                 # Maximum temperature clamp (most random)
  queue_penalty_weight: 2.5     # Exponential queue penalty: load_mod = exp(-qpw * db² / 2500) [optimizable: 0.5..5.0]
  cold_start_threshold: 0.37    # Min overlap to trust scoring (below = round-robin; 0 = never round-robin)
  load_mod_floor: 0.3           # Global minimum load_mod for ALL workers (0 = disabled)

  # --- Feature toggles (false = off, true = on) ---
  # All default to false when not present, preserving base-only behavior.
  enable_softmax: false         # Softmax probabilistic selection (false = deterministic argmax)
  enable_cold_start: false      # Round-robin when all overlaps below cold_start_threshold
  enable_idle_boost: false      # Apply idle_boost floor to overlap scores
  enable_load_mod_floor: false  # Apply load_mod_floor to prevent KV signal erasure
  enable_lints: true            # LinTS contextual bandit (7-dim feature-aware exploration)
  enable_affinity: false        # Prefix stickiness bonus for multi-turn sessions
  enable_switching_cost: false  # Penalty for migrating a prefix to a different worker
  enable_adaptive_temp: false   # Temperature decays with session depth (greedier late in session)
  enable_adaptive_explore: false # Beta-TS weight decays with session depth
  enable_sticky_floor: false    # Protect sticky worker's load_mod minimum

  # --- Feature-specific weights (only used when corresponding toggle is enabled) ---
  lints_weight: -1.0            # LinTS weight. Negative = tanh-bounded to [-1,1]. Positive = raw. [optimizable: -2.0..2.0]
  affinity_base: 0.15           # Base stickiness bonus (enable_affinity)
  affinity_reuse_weight: 0.02   # Additional bonus per remaining request (enable_affinity)
  switch_base: 0.04             # Base switching penalty (enable_switching_cost)
  switch_reuse: 0.01            # Additional penalty per remaining request (enable_switching_cost)
  sticky_load_floor: 0.01       # Minimum load_mod for sticky worker (enable_sticky_floor)
  adaptive_temp_base: 1.0       # Base temperature before decay (enable_adaptive_temp)

# Debug settings
debug:
  traces_enabled: false                     # Enable debug trace logging
  trace_dir: /tmp/dynamo_router_traces      # Directory for trace files
  buffer_size: 2000                         # In-memory trace buffer size
